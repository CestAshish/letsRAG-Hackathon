services:
  backend:
    build:
      context: .
      target: backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app/data:/app/app/data          # Pre-computed indexes
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
